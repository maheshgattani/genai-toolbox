# Sources configuration
sources:
  # Pub/Sub source configuration
  my-pubsub:
    kind: pubsub
    projectId: resbooker-c6fa3  # Replace with your GCP project ID
    # Optional: Path to service account key file
    # credentialsFile: /path/to/creds.json
    # Optional: Endpoint for Pub/Sub emulator
    # endpoint: localhost:8085

authServices:
  my-auth-service:
    kind: google
    clientId: "896923433028-ue34tui6aihuva40il2f30dqp78g0rfl.apps.googleusercontent.com"  # Replace with your Google OAuth client ID

# Tools configuration
tools:
  # Tool to create a Pub/Sub topic
  pubsubcreatetopic:
    name: pubsubcreatetopic
    kind: pubsubcreatetopic
    source: my-pubsub  # References the Pub/Sub source defined above
    description: "Creates a new Cloud Pub/Sub topic"
    # authRequired:
    #   - my-auth-service    

  pubsubdeletetopic:
    name: pubsubdeletetopic
    kind: pubsubdeletetopic
    source: my-pubsub
    description: "Deletes a Cloud Pub/Sub topic"
    # authRequired:
    #   - my-auth-service    